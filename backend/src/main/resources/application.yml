spring:
  application:
    name: nuvexa-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:nuvexa}
    username: ${DB_USER:nuvexa}
    password: ${DB_PASSWORD:nuvexa}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

springdoc:
  auto-tag-classes: false

app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  mail:
    from: ${MAIL_FROM:}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:nuvexa}
    secret-key: ${STORAGE_SECRET_KEY:nuvexa123}
    bucket: ${STORAGE_BUCKET:nuvexa-anexos}
    region: ${STORAGE_REGION:us-east-1}
