          description: "Paciente não encontrado"
          schema: "ApiErro"
    "PUT /api/v1/pacientes/{pacienteId}/perfil-nutricional":
      summary: "Atualizar perfil nutricional do paciente"
      parameters:
        pacienteId:
          description: "ID do paciente"
      responses:
        "200":
          description: "Perfil nutricional atualizado com sucesso"
        "400":
          description: "Dados inválidos"
          schema: "ApiErro"
        "404":
          description: "Perfil nutricional não encontrado para o paciente"
          schema: "ApiErro"
    "DELETE /api/v1/pacientes/{pacienteId}/perfil-nutricional":
      summary: "Remover perfil nutricional do paciente"
      description: "Remove o perfil nutricional; o cadastro do paciente é preservado"
      parameters:
        pacienteId:
          description: "ID do paciente"
      responses:
        "204":
          description: "Perfil nutricional removido com sucesso"
        "404":
          description: "Perfil nutricional não encontrado para o paciente"
          schema: "ApiErro"

