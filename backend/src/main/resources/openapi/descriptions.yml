ProntuarioController:
  tag: "Prontuários"
  tagDescription: "Registro clínico do paciente (prontuário), com fluxo rascunho/pendente → assinatura e trilha de auditoria"
  endpoints:
    "GET /api/v1/prontuarios":
      summary: "Listar prontuários"
      description: "Retorna os prontuários da organização do usuário autenticado, com filtro opcional por paciente e por nome do paciente"
      parameters:
        pacienteId:
          description: "ID do paciente para filtrar os prontuários"
        busca:
          description: "Termo de busca por nome do paciente"
    "GET /api/v1/prontuarios/{id}":
      summary: "Buscar prontuário por ID"
      parameters:
        id:
          description: "ID do prontuário"
      responses:
        "200":
          description: "Prontuário encontrado"
        "404":
          description: "Prontuário não encontrado"
          schema: "ApiErro"
    "GET /api/v1/prontuarios/enums":
      summary: "Listar opções de enums do prontuário"
      description: "Retorna os valores possíveis (com rótulo traduzido) para seção, status e tipo de evento de auditoria, usados para popular selects no frontend"
    "POST /api/v1/prontuarios":
      summary: "Cadastrar prontuário"
      description: "Não é possível criar um prontuário já com status ASSINADO — use a ação de assinatura (PATCH /api/v1/prontuarios/{id}/assinar) para finalizar o registro"
      responses:
        "201":
          description: "Prontuário criado com sucesso"
        "400":
          description: "Dados inválidos"
          schema: "ApiErro"
        "404":
          description: "Paciente não encontrado"
          schema: "ApiErro"
    "PUT /api/v1/prontuarios/{id}":
      summary: "Atualizar prontuário"
      description: "O paciente do prontuário não é editável (fixo desde a criação); prontuário assinado não pode ser alterado; não é possível definir status ASSINADO por aqui — use a ação de assinatura (PATCH /api/v1/prontuarios/{id}/assinar)"
      parameters:
        id:
          description: "ID do prontuário"
      responses:
        "200":
          description: "Prontuário atualizado com sucesso"
        "400":
          description: "Dados inválidos"
          schema: "ApiErro"
        "404":
          description: "Prontuário não encontrado"
          schema: "ApiErro"
    "DELETE /api/v1/prontuarios/{id}":
      summary: "Remover prontuário"
      description: "Prontuário assinado não pode ser excluído; prontuário com adendo ou anexo associado também não pode ser excluído (exclua os filhos primeiro)"
      parameters:
        id:
          description: "ID do prontuário"
      responses:
        "204":
          description: "Prontuário removido com sucesso"
        "400":
          description: "Prontuário assinado não pode ser excluído, ou possui adendo/anexo associado"
          schema: "ApiErro"
        "404":
          description: "Prontuário não encontrado"
          schema: "ApiErro"
    "PATCH /api/v1/prontuarios/{id}/assinar":
      summary: "Assinar prontuário"
      description: "Finaliza o registro: define status ASSINADO, o autor da assinatura e a data/hora; a partir daqui o prontuário fica imutável (não pode mais ser alterado ou excluído)"
      parameters:
        id:
          description: "ID do prontuário"
      responses:
        "200":
          description: "Prontuário assinado com sucesso"
        "400":
          description: "Prontuário já assinado (imutável), ou sem conteúdo preenchido"
          schema: "ApiErro"
        "404":
          description: "Prontuário não encontrado"
          schema: "ApiErro"
    "GET /api/v1/prontuarios/{id}/auditoria":
      summary: "Listar eventos de auditoria do prontuário"
      description: "Retorna o histórico de criação/edição/assinatura/exclusão do prontuário — quem alterou, quando, e o snapshot antes/depois de cada mudança"
      parameters:
        id:
          description: "ID do prontuário"
      responses:
        "200":
          description: "Eventos de auditoria encontrados"
        "404":
          description: "Prontuário não encontrado"
          schema: "ApiErro"

ProntuarioAdendoController:
  tag: "Adendos de prontuário"
  tagDescription: "Notas complementares adicionadas a um prontuário já assinado, sem alterar o conteúdo original — imutáveis desde a criação (sem edição ou exclusão)"
  endpoints:
    "GET /api/v1/prontuarios/{prontuarioId}/adendos":
      summary: "Listar adendos do prontuário"
      parameters:
        prontuarioId:
          description: "ID do prontuário"
      responses:
        "200":
          description: "Adendos encontrados"
        "404":
          description: "Prontuário não encontrado"
          schema: "ApiErro"
    "POST /api/v1/prontuarios/{prontuarioId}/adendos":
      summary: "Adicionar adendo ao prontuário"
      description: "Só é possível adicionar adendo a um prontuário já assinado"
      parameters:
        prontuarioId:
          description: "ID do prontuário"
      responses:
        "201":
          description: "Adendo criado com sucesso"
        "400":
          description: "Dados inválidos"
          schema: "ApiErro"
        "404":
          description: "Prontuário não encontrado"
          schema: "ApiErro"

ProntuarioAnexoController:
  tag: "Anexos de prontuário"
  tagDescription: "Upload, listagem, download e exclusão de arquivos anexados a um prontuário — upload e exclusão bloqueados depois que o prontuário é assinado"
  endpoints:
    "GET /api/v1/prontuarios/{prontuarioId}/anexos":
      summary: "Listar anexos do prontuário"
      parameters:
        prontuarioId:
          description: "ID do prontuário"
      responses:
        "200":
          description: "Anexos encontrados"
        "404":
          description: "Prontuário não encontrado"
          schema: "ApiErro"
    "POST /api/v1/prontuarios/{prontuarioId}/anexos":
      summary: "Enviar anexo ao prontuário"
      description: "Só é possível enviar anexo a um prontuário ainda não assinado; tamanho máximo 10MB; tipos permitidos: PDF, JPG, PNG, DOC, DOCX, XLS, XLSX"
      parameters:
        prontuarioId:
          description: "ID do prontuário"
      responses:
        "201":
          description: "Anexo enviado com sucesso"
        "400":
          description: "Arquivo vazio, maior que 10MB, de tipo/extensão não permitidos, ilegível, ou prontuário já assinado (imutável)"
          schema: "ApiErro"
        "404":
          description: "Prontuário não encontrado"
          schema: "ApiErro"
    "GET /api/v1/prontuarios/{prontuarioId}/anexos/{anexoId}/download":
      summary: "Baixar anexo do prontuário"
      description: "Retorna o conteúdo binário do arquivo como anexo (Content-Disposition), com tipo MIME e nome original preservados"
      parameters:
        prontuarioId:
          description: "ID do prontuário"
        anexoId:
          description: "ID do anexo"
      responses:
        "200":
          description: "Arquivo retornado com sucesso"
        "404":
          description: "Prontuário não encontrado, ou anexo não encontrado nesse prontuário"
          schema: "ApiErro"
    "DELETE /api/v1/prontuarios/{prontuarioId}/anexos/{anexoId}":
      summary: "Remover anexo do prontuário"
      description: "Só é possível excluir anexo de um prontuário ainda não assinado"
      parameters:
        prontuarioId:
          description: "ID do prontuário"
        anexoId:
          description: "ID do anexo"
      responses:
        "204":
          description: "Anexo removido com sucesso"
        "400":
          description: "Não é possível excluir anexo de um prontuário assinado"
          schema: "ApiErro"
        "404":
          description: "Prontuário não encontrado, ou anexo não encontrado nesse prontuário"
          schema: "ApiErro"

ProntuarioRelatorioController:
  tag: "Relatório de prontuários"
  tagDescription: "Geração de relatório de prontuários em JSON ou planilha Excel"
  endpoints:
    "GET /api/v1/prontuarios/relatorio":
      summary: "Gerar relatório de prontuários"
      description: "Retorna as linhas do relatório em JSON, com os mesmos filtros disponíveis na versão Excel"
      parameters:
        busca:
          description: "Termo de busca por nome do paciente"
        status:
          description: "Filtro por status do prontuário"
        secao:
          description: "Filtro por seção do prontuário"
        periodo:
          description: "Filtro por período (hoje, 7d, 30d, 90d, ano), baseado na data da última atualização do prontuário"
        autorId:
          description: "Filtro por autor"
        anexo:
          description: "Filtro por presença de anexo (sim, nao) — informar as duas opções juntas equivale a não filtrar"
    "GET /api/v1/prontuarios/relatorio/excel":
      summary: "Baixar relatório de prontuários em Excel"
      description: "Gera e retorna o relatório como planilha .xlsx (attachment) com os mesmos filtros da versão JSON"
      parameters:
        busca:
          description: "Termo de busca por nome do paciente"
        status:
          description: "Filtro por status do prontuário"
        secao:
          description: "Filtro por seção do prontuário"
        periodo:
          description: "Filtro por período (hoje, 7d, 30d, 90d, ano), baseado na data da última atualização do prontuário"
        autorId:
          description: "Filtro por autor"
        anexo:
          description: "Filtro por presença de anexo (sim, nao) — informar as duas opções juntas equivale a não filtrar"
      responses:
        "200":
          description: "Planilha gerada com sucesso"

MenuController:
  tag: "Menus"
  tagDescription: "Estrutura de navegação (menu lateral) do frontend"
  endpoints:
    "GET /api/v1/menus":
      summary: "Listar itens de menu"
      description: "Retorna a árvore de navegação (grupos e itens navegáveis) usada para renderizar o menu lateral do frontend; a estrutura vem de menu.yml no backend, igual para todo usuário/organização (não é personalizável)"

AutenticacaoController:
  tag: "Autenticação"
  tagDescription: "Cadastro, login e recuperação de senha"
  endpoints:
    "POST /api/v1/auth/cadastrar":
      summary: "Cadastrar organização e usuário"
      description: "Cria a organização e o usuário administrador inicial, retornando o token de acesso"
      responses:
        "201":
          description: "Cadastro criado com sucesso"
        "400":
          description: "Dados inválidos"
          schema: "ApiErro"
        "409":
          description: "E-mail já cadastrado"
          schema: "ApiErro"
    "POST /api/v1/auth/login":
      summary: "Autenticar usuário"
      description: "Valida as credenciais e retorna o token JWT de acesso"
      responses:
        "200":
          description: "Login efetuado com sucesso"
        "401":
          description: "Credenciais inválidas"
          schema: "ApiErro"
    "POST /api/v1/auth/esqueci-senha":
      summary: "Solicitar recuperação de senha"
      description: "Envia por e-mail um link para redefinição de senha, se o e-mail informado estiver cadastrado"
    "POST /api/v1/auth/redefinir-senha":
      summary: "Redefinir senha"
      description: "Define uma nova senha a partir do token recebido por e-mail"
      responses:
        "200":
          description: "Senha redefinida com sucesso"
        "400":
          description: "Token inválido ou expirado"
          schema: "ApiErro"
